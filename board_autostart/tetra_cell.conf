# tetra_cell.conf — Board-Auto-Start-Konfiguration
# Verbraucht von /root/tetra_autostart.sh
# =============================================================================

# RF-Konfiguration
RX_FREQ_HZ=428250000           # UL-LO (TETRA 70cm Amateur, MS-TX)
TX_FREQ_HZ=438250000           # DL-LO (BS-TX)
SAMPLERATE_HZ=4608000          # CIC R=64 → 72 kHz = 4× Symbolrate
RF_BW_HZ=200000                # AD9361 RX-Filter Min
GAIN_MODE=fast_attack          # TETRA Burst-Mode (siehe memory_audio_setup)

# TX-Pegel (Dämpfung in dB, negativer Wert = mehr Dämpfung = weniger Leistung)
TX_ATT_INIT_DB=-89             # Sehr leise während Init-Phase
TX_ATT_OP_DB=-10               # Operativer Pegel nach Init

# VCXO/Clock
VCXO_DAC_VAL=153               # DAC5311 sweet-spot (siehe vcxo_cal.sh)
XO_CORRECTION_HZ=40000000      # AD9361 xo_correction (nominal)

# Tetra-Cell-Tuning
NUB_SYNC_THRESH=11             # 2026-05-17 Survey-Optimum (BFI 4.7%)
DB_POLICY=0x3                  # accept_unknown_issi + gssi
