<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1300" font-family="sans-serif" font-size="14">
  <rect width="1900" height="1300" fill="#fdfdfd"/>

  <text x="950" y="34" text-anchor="middle" font-size="24" font-weight="bold">TETRA-FPGA Datenstrom NEU (Z.12 Vorschlag)</text>
  <text x="950" y="58" text-anchor="middle" font-size="14" fill="#666">AACH gehört zum Burst-Bundle des Producers — atomar durch Queue, kein Override, kein Latch, keine Race</text>

  <!-- Section: DL-Pfad -->
  <text x="40" y="100" font-size="20" font-weight="bold" fill="#0a4a8a">DL-Pfad (BS sendet)</text>

  <!-- Producers -->
  <g>
    <!-- Slotgrant -->
    <rect x="40" y="120" width="240" height="120" fill="#cfe5ff" stroke="#0a4a8a" stroke-width="2"/>
    <text x="160" y="145" text-anchor="middle" font-weight="bold">tetra_pre_reply_slotgrant</text>
    <text x="160" y="167" text-anchor="middle" font-size="11">Trigger: frag1_pulse</text>
    <text x="160" y="184" text-anchor="middle" font-size="11">→ 124-bit AL-SETUP</text>
    <text x="160" y="200" text-anchor="middle" font-size="11">→ SCH/HD 216-coded</text>
    <text x="160" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a4a8a">+ AACH 0x0009 → 30-coded</text>

    <!-- MLE FSM -->
    <rect x="40" y="260" width="240" height="120" fill="#cfe5ff" stroke="#0a4a8a" stroke-width="2"/>
    <text x="160" y="285" text-anchor="middle" font-weight="bold">tetra_mle_registration_fsm</text>
    <text x="160" y="307" text-anchor="middle" font-size="11">Trigger: SW REPLY_GO</text>
    <text x="160" y="324" text-anchor="middle" font-size="11">→ 268-bit MAC-RES</text>
    <text x="160" y="340" text-anchor="middle" font-size="11">→ SCH/F 432-coded</text>
    <text x="160" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a4a8a">+ AACH 0x0009 → 30-coded</text>

    <!-- GroupAck -->
    <rect x="40" y="400" width="240" height="120" fill="#cfe5ff" stroke="#0a4a8a" stroke-width="2"/>
    <text x="160" y="425" text-anchor="middle" font-weight="bold">d_attach_detach_grp_id_ack</text>
    <text x="160" y="447" text-anchor="middle" font-size="11">Trigger: SW GRP_REPLY_GO</text>
    <text x="160" y="464" text-anchor="middle" font-size="11">→ 268-bit MAC-RES</text>
    <text x="160" y="480" text-anchor="middle" font-size="11">→ SCH/F 432-coded</text>
    <text x="160" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a4a8a">+ AACH 0x0009 → 30-coded</text>

    <!-- D-NWRK -->
    <rect x="40" y="540" width="240" height="120" fill="#ffe9c0" stroke="#a06000" stroke-width="2"/>
    <text x="160" y="565" text-anchor="middle" font-weight="bold">tetra_dl_nwrk_broadcast</text>
    <text x="160" y="587" text-anchor="middle" font-size="11">Trigger: 10 MF auto-fire</text>
    <text x="160" y="604" text-anchor="middle" font-size="11">→ SCH/F 432 (SW prepacked)</text>
    <text x="160" y="642" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06000">+ AACH 0x0249 → 30-coded</text>

    <!-- BL-ACK -->
    <rect x="40" y="680" width="240" height="120" fill="#dceedb" stroke="#205020" stroke-width="2"/>
    <text x="160" y="705" text-anchor="middle" font-weight="bold">tetra_pre_reply_blck</text>
    <text x="160" y="727" text-anchor="middle" font-size="11">Trigger: reass+IE-done</text>
    <text x="160" y="744" text-anchor="middle" font-size="11">→ 124-bit BL-ACK</text>
    <text x="160" y="760" text-anchor="middle" font-size="11">→ SCH/HD 216-coded</text>
    <text x="160" y="782" text-anchor="middle" font-size="12" font-weight="bold" fill="#205020">+ AACH 0x0249 → 30-coded</text>
  </g>

  <!-- AACH-RM-Encoder (NEU shared, einmalig pro Push) -->
  <rect x="320" y="280" width="200" height="200" fill="#f0e6ff" stroke="#5028a0" stroke-width="2"/>
  <text x="420" y="308" text-anchor="middle" font-weight="bold">aach_rm_encode</text>
  <text x="420" y="328" text-anchor="middle" font-size="11">14-bit pattern + colour-code</text>
  <text x="420" y="345" text-anchor="middle" font-size="11">+ slot_num → 30-bit RM-coded</text>
  <text x="420" y="368" text-anchor="middle" font-size="11" fill="#5028a0" font-weight="bold">EINMALIG pro Producer-Push</text>
  <text x="420" y="388" text-anchor="middle" font-size="11">(nicht pro Slot-Encode!)</text>
  <line x1="320" y1="400" x2="520" y2="400" stroke="#5028a0"/>
  <text x="420" y="425" text-anchor="middle" font-size="11">Producer ruft auf bei Push:</text>
  <text x="420" y="445" text-anchor="middle" font-size="11">aach_coded[29:0] =</text>
  <text x="420" y="463" text-anchor="middle" font-size="11">aach_rm_encode(pattern,cc)</text>

  <!-- Pfeile Producer → AACH-Encode -->
  <path d="M 280 200 L 320 320" stroke="#0a4a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 340 L 320 360" stroke="#0a4a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 480 L 320 400" stroke="#0a4a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 620 L 320 430" stroke="#a06000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 760 L 320 460" stroke="#205020" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Queue (mit aach_coded als zusätzliches Feld) -->
  <rect x="600" y="180" width="280" height="500" fill="#fff5cc" stroke="#a07000" stroke-width="3"/>
  <text x="740" y="210" text-anchor="middle" font-weight="bold" font-size="18">DL-Signal-Queue</text>
  <text x="740" y="232" text-anchor="middle" font-size="12">DEPTH=4, 4 Prio-Klassen</text>
  <line x1="600" y1="244" x2="880" y2="244" stroke="#a07000"/>
  <text x="740" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07000">Per-Eintrag (atomar):</text>
  <text x="615" y="290" font-size="12">• coded[431:0] (216 oder 432 bit)</text>
  <text x="615" y="310" font-size="12">• pdu_type[1:0] (SCH_F / SCH_HD)</text>
  <text x="615" y="330" font-size="12">• target_tn[1:0]</text>
  <text x="615" y="350" font-size="12">• prio[1:0]</text>
  <text x="615" y="372" font-size="13" fill="#5028a0" font-weight="bold">• aach_coded[29:0] ← NEU</text>
  <text x="615" y="392" font-size="11" fill="#5028a0">  (vom Producer schon RM-coded)</text>
  <line x1="600" y1="410" x2="880" y2="410" stroke="#a07000"/>
  <text x="740" y="435" text-anchor="middle" font-size="13" font-weight="bold">head_* outputs (combinational)</text>
  <text x="615" y="460" font-size="12">head_valid</text>
  <text x="615" y="480" font-size="12">head_coded[431:0]</text>
  <text x="615" y="500" font-size="12">head_pdu_type[1:0]</text>
  <text x="615" y="520" font-size="12">head_target_tn[1:0]</text>
  <text x="615" y="540" font-size="13" fill="#5028a0" font-weight="bold">head_aach_coded[29:0] ← NEU</text>
  <line x1="600" y1="555" x2="880" y2="555" stroke="#a07000"/>
  <text x="740" y="580" text-anchor="middle" font-size="13" fill="#a00" font-weight="bold">Pop happens am Slot-Encode-Done</text>
  <text x="740" y="600" text-anchor="middle" font-size="11">(nicht 1F voraus am Frame-wrap)</text>
  <text x="740" y="625" text-anchor="middle" font-size="12" fill="#205020" font-weight="bold">→ atomares Bundle on-air</text>

  <path d="M 520 380 L 600 400" stroke="#5028a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Slot-Encoder (= Slot-Mux + AACH-Slot-Inserter) -->
  <rect x="940" y="200" width="280" height="280" fill="#cfe5ff" stroke="#0a4a8a" stroke-width="3"/>
  <text x="1080" y="230" text-anchor="middle" font-weight="bold" font-size="16">Slot-Encoder (slot_pulse)</text>
  <text x="1080" y="250" text-anchor="middle" font-size="11">tetra_slot_content_mux + tx_chain</text>
  <line x1="940" y1="262" x2="1220" y2="262" stroke="#0a4a8a"/>
  <text x="1080" y="285" text-anchor="middle" font-size="12" font-weight="bold">Pro Slot:</text>
  <text x="955" y="308" font-size="12">if head_valid &amp;&amp; (head_target_tn == tn):</text>
  <text x="975" y="328" font-size="12">  body = head_coded</text>
  <text x="975" y="346" font-size="12" fill="#5028a0" font-weight="bold">  aach = head_aach_coded ← atomar!</text>
  <text x="975" y="365" font-size="12">  pop_queue ← nach Encode-Done</text>
  <text x="955" y="388" font-size="12">else:</text>
  <text x="975" y="408" font-size="12">  body = Schedule-BRAM (SYSINFO/NULL)</text>
  <text x="975" y="426" font-size="12">  aach = aach_default(tn,fn,mn)</text>
  <text x="975" y="444" font-size="11" fill="#666">       (idle 0x0249 / F18 / traffic 0x3000)</text>
  <line x1="940" y1="455" x2="1220" y2="455" stroke="#0a4a8a"/>
  <text x="1080" y="475" text-anchor="middle" font-size="12" fill="#205020">→ tx_blkN_slot + aach_coded → tx_chain</text>

  <path d="M 880 480 L 940 360" stroke="#a07000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="430" font-size="11" fill="#a07000" font-weight="bold">head_*</text>

  <!-- AACH-Default-Generator (vereinfacht) -->
  <rect x="940" y="520" width="280" height="160" fill="#eee" stroke="#666" stroke-width="2"/>
  <text x="1080" y="548" text-anchor="middle" font-weight="bold">tetra_aach_encoder (default-only)</text>
  <text x="1080" y="568" text-anchor="middle" font-size="11">vereinfacht: nur F18 + idle + traffic</text>
  <line x1="940" y1="580" x2="1220" y2="580" stroke="#666"/>
  <text x="955" y="602" font-size="11">if fn==17 → F18-Anker</text>
  <text x="955" y="620" font-size="11">elif tn==0 → 0x0249 (MCCH idle)</text>
  <text x="955" y="638" font-size="11">elif tn!=0 → 0x3000/0x2049/0x2249</text>
  <text x="1080" y="668" text-anchor="middle" font-size="11" fill="#205020">→ aach_coded[29:0] (default)</text>

  <!-- TX Chain -->
  <rect x="1300" y="350" width="200" height="120" fill="#dceedb" stroke="#205020" stroke-width="2"/>
  <text x="1400" y="380" text-anchor="middle" font-weight="bold">tetra_tx_chain</text>
  <text x="1400" y="402" text-anchor="middle" font-size="11">burst_builder + burst_mux</text>
  <text x="1400" y="420" text-anchor="middle" font-size="11">+ pi/4-DQPSK + RRC</text>
  <text x="1400" y="445" text-anchor="middle" font-size="11">→ AD9361 → TX 438.25 MHz</text>
  <text x="1400" y="460" text-anchor="middle" font-size="11" font-weight="bold">→ MTP3550</text>

  <path d="M 1220 360 L 1300 400" stroke="#0a4a8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Was wegfällt -->
  <g>
    <rect x="1300" y="540" width="540" height="220" fill="#ffeeee" stroke="#a00" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1570" y="568" text-anchor="middle" font-weight="bold" font-size="14" fill="#a00">↯ Was wegfällt (vereinfacht):</text>
    <text x="1320" y="595" font-size="12">✗ Scheduler-Bundle-Latch (= Race-Quelle)</text>
    <text x="1320" y="615" font-size="12">✗ sched_aach_override_tn0..tn3_sys</text>
    <text x="1320" y="635" font-size="12">✗ aach_override_valid_sys / aach_override_info_sys</text>
    <text x="1320" y="655" font-size="12">✗ AACH-Encoder Branch 2 (Override-Pfad)</text>
    <text x="1320" y="675" font-size="12">✗ Per-TN sched_blk1/blk2/ndb2/active Latches</text>
    <text x="1320" y="695" font-size="12">✗ Off-by-One zwischen Body-Latch und AACH-Latch</text>
    <text x="1320" y="725" font-size="12" fill="#205020" font-weight="bold">+ Slice-Bilanz: ~1800 FFs gespart</text>
    <text x="1320" y="745" font-size="12" fill="#205020" font-weight="bold">+ Konzept-Klarheit: AACH gehört zum Producer-Bundle</text>
  </g>

  <!-- Section: Concept Box -->
  <rect x="40" y="850" width="1820" height="180" fill="#f3f8fd" stroke="#0a4a8a" stroke-width="2"/>
  <text x="950" y="882" text-anchor="middle" font-size="18" font-weight="bold" fill="#0a4a8a">Konzept: AACH gehört zum Producer-Bundle</text>

  <text x="60" y="920" font-size="13" font-weight="bold">Producer-Verantwortung:</text>
  <text x="60" y="945" font-size="12">Wer den Burst baut weiß welcher AACH dazu passt:</text>
  <text x="60" y="965" font-size="12">  • Pre-Reply LI=7 → 0x0009</text>
  <text x="60" y="983" font-size="12">  • Final ACCEPT/ACK LI=21/16 → 0x0009</text>
  <text x="60" y="1001" font-size="12">  • BL-ACK LI=6 → 0x0249 idle</text>
  <text x="60" y="1019" font-size="12">  • D-NWRK-BCAST → 0x0249 idle</text>

  <text x="700" y="920" font-size="13" font-weight="bold">Konsequenz:</text>
  <text x="700" y="945" font-size="12">• Body und AACH werden gemeinsam erzeugt + gepusht</text>
  <text x="700" y="965" font-size="12">• Queue speichert beide atomar als ein Bundle</text>
  <text x="700" y="983" font-size="12">• Slot-Encoder zieht beide gleichzeitig raus</text>
  <text x="700" y="1001" font-size="12">• Pop nach Slot-Encode-Done (nicht 1F vorher)</text>
  <text x="700" y="1019" font-size="12">• Race-frei. Ende.</text>

  <text x="1300" y="920" font-size="13" font-weight="bold">PDU-Class Single-Source:</text>
  <text x="1300" y="945" font-size="12">tetra_pdu_class.vh definiert pro Class:</text>
  <text x="1300" y="963" font-size="12">  PDUC_*_FMT, PDUC_*_AACH, PDUC_*_LLC, …</text>
  <text x="1300" y="983" font-size="12">Producer importiert Class-Tupel → Konsistenz</text>
  <text x="1300" y="1001" font-size="12">über alle PDUs garantiert</text>

  <!-- Legend -->
  <text x="40" y="1080" font-size="16" font-weight="bold" fill="#444">Legende</text>
  <rect x="40" y="1095" width="20" height="20" fill="#cfe5ff" stroke="#0a4a8a"/>
  <text x="68" y="1110" font-size="12">RTL-Producer / Slot-Encoder</text>

  <rect x="280" y="1095" width="20" height="20" fill="#fff5cc" stroke="#a07000"/>
  <text x="308" y="1110" font-size="12">Queue (Bundle-Storage)</text>

  <rect x="500" y="1095" width="20" height="20" fill="#f0e6ff" stroke="#5028a0"/>
  <text x="528" y="1110" font-size="12">AACH-RM-Encode (Producer-side)</text>

  <rect x="780" y="1095" width="20" height="20" fill="#dceedb" stroke="#205020"/>
  <text x="808" y="1110" font-size="12">TX-Chain / On-Air</text>

  <rect x="980" y="1095" width="20" height="20" fill="#ffeeee" stroke="#a00" stroke-dasharray="4,3"/>
  <text x="1008" y="1110" font-size="12">Wegfallend (alte Mimik)</text>

  <text x="40" y="1170" font-size="13" font-weight="bold" fill="#205020">Vorteile vs Z.11:</text>
  <text x="40" y="1192" font-size="12">• 1 RTL-Modul (tetra_dl_signal_scheduler) reduziert oder eliminiert</text>
  <text x="40" y="1212" font-size="12">• AACH-Encoder reduziert auf default-only (F18/idle/traffic) — kein Override-Pfad mehr</text>
  <text x="40" y="1232" font-size="12">• Konzeptionell: jedes Burst-Producer-Modul ist Eigentümer seiner kompletten on-air-Repräsentation (Body + AACH)</text>
  <text x="40" y="1252" font-size="12">• Race-frei garantiert: Body + AACH kommen aus DEM SELBEN Queue-Eintrag im SELBEN Cycle</text>
  <text x="40" y="1272" font-size="12">• Slice-Bilanz: -1800 FFs (alle Scheduler-Latches weg) + ggf. neuer aach_coded[29:0]-Storage in Queue (= 4×30 = 120 FFs)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
</svg>
