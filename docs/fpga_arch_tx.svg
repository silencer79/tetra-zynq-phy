<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Helvetica,Arial,sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c00"/>
    </marker>
    <style>
      .blk { stroke:#444; stroke-width:1.2; }
      .wrapper { fill:none; stroke:#444; stroke-width:2; stroke-dasharray:6,4; }
      .sys  { fill:#d4edda; }
      .axi  { fill:#fff3cd; }
      .mb   { fill:#f5f5f5; stroke:#888; stroke-dasharray:3,2; }
      .lbl  { font-weight:bold; }
      .leg  { font-weight:bold; font-size:11px; }
      .small { font-size:10px; }
      .arr  { stroke:#333; stroke-width:1.4; fill:none; }
      .arr-red { stroke:#c00; stroke-width:1.6; fill:none; }
    </style>
  </defs>

  <text x="700" y="28" text-anchor="middle" font-size="20" class="lbl">TETRA-BS — TX-Pfad (hierarchisch)</text>
  <text x="700" y="48" text-anchor="middle" font-size="11" fill="#666">Stand 02e3214 (2026-05-24). Gestrichelte Boxes = Wrapper-Module die Sub-Encoder enthalten.</text>

  <!-- Legend -->
  <g transform="translate(20,70)">
    <rect class="blk sys" x="0" y="0" width="20" height="14"/><text x="26" y="11" class="leg">RTL-Modul (clk_sys)</text>
    <rect class="wrapper" x="200" y="0" width="20" height="14"/><text x="226" y="11" class="leg">Wrapper (enthält Sub-Module)</text>
    <rect class="blk mb" x="500" y="0" width="20" height="14"/><text x="526" y="11" class="leg">AXI-Mailbox (SW schreibt rein)</text>
    <rect class="blk axi" x="780" y="0" width="20" height="14"/><text x="806" y="11" class="leg">AXI-Reg (SW liest/schreibt)</text>
  </g>

  <!-- ============================================================ -->
  <!-- 1. SCHEDULE LAYER (oben) -->
  <!-- ============================================================ -->
  <g transform="translate(0,110)">
    <rect class="blk sys" x="500" y="0" width="200" height="46" rx="4"/>
    <text x="600" y="20" text-anchor="middle" class="lbl">tetra_tdma_timebase</text>
    <text x="600" y="34" text-anchor="middle" class="small">tx_slot_pulse + FN/MN/HN/TN</text>

    <rect class="blk sys" x="500" y="70" width="200" height="46" rx="4"/>
    <text x="600" y="90" text-anchor="middle" class="lbl">tetra_slot_schedule</text>
    <text x="600" y="104" text-anchor="middle" class="small">BRAM-LUT (144 entries)</text>

    <rect class="blk sys" x="500" y="140" width="200" height="46" rx="4"/>
    <text x="600" y="160" text-anchor="middle" class="lbl">tetra_slot_content_mux</text>
    <text x="600" y="174" text-anchor="middle" class="small">picks PDU per (TN,FN)</text>

    <rect class="blk axi" x="780" y="70" width="170" height="46" rx="4"/>
    <text x="865" y="88" text-anchor="middle" class="lbl">REG_SCHEDULE_BRAM</text>
    <text x="865" y="102" text-anchor="middle" class="small">0x400..0x63F</text>

    <line x1="600" y1="46" x2="600" y2="70" class="arr" marker-end="url(#a)"/>
    <line x1="600" y1="116" x2="600" y2="140" class="arr" marker-end="url(#a)"/>
    <line x1="780" y1="92" x2="700" y2="92" class="arr-red" marker-end="url(#ar)"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. PDU-BUILD LAYER (Mitte) — 3 separate Pipelines -->
  <!-- ============================================================ -->
  <text x="40" y="330" class="lbl" font-size="14">PDU-Build (3 parallele Pipelines, je eigener Output)</text>

  <!-- PIPELINE A: tetra_dl_pdu_builder (Wrapper) -->
  <g transform="translate(40,340)">
    <rect class="wrapper" x="0" y="0" width="400" height="220" rx="6"/>
    <text x="200" y="-6" text-anchor="middle" class="lbl">tetra_dl_pdu_builder (Wrapper)</text>
    <text x="200" y="20" text-anchor="middle" class="small">SW-driven: nimmt raw 432-bit DL-PDU vom SW + encoded</text>

    <rect class="blk sys" x="30" y="50" width="160" height="40" rx="3"/>
    <text x="110" y="65" text-anchor="middle" class="lbl small">tetra_sch_f_encoder</text>
    <text x="110" y="78" text-anchor="middle" class="small">268→432 type-5</text>

    <rect class="blk sys" x="210" y="50" width="170" height="40" rx="3"/>
    <text x="295" y="65" text-anchor="middle" class="lbl small">mac_resource_dl_builder</text>
    <text x="295" y="78" text-anchor="middle" class="small">MAC-RESOURCE PDU build</text>

    <rect class="blk sys" x="30" y="110" width="160" height="40" rx="3"/>
    <text x="110" y="125" text-anchor="middle" class="lbl small">basic_slotgrant_encoder</text>
    <text x="110" y="138" text-anchor="middle" class="small">D-Slotgrant build</text>

    <rect class="blk sys" x="210" y="110" width="170" height="40" rx="3"/>
    <text x="295" y="125" text-anchor="middle" class="lbl small">mac_resource_bl_ack_builder</text>
    <text x="295" y="138" text-anchor="middle" class="small">BL-ACK build</text>

    <rect class="blk mb" x="30" y="170" width="160" height="36" rx="3"/>
    <text x="110" y="185" text-anchor="middle" class="lbl small">REG_DL_RAW_PDU</text>
    <text x="110" y="197" text-anchor="middle" class="small">SW pushes 432-bit</text>

    <rect class="blk mb" x="210" y="170" width="170" height="36" rx="3"/>
    <text x="295" y="185" text-anchor="middle" class="lbl small">REG_NDB/MCCH/BNCH_BLK_*</text>
    <text x="295" y="197" text-anchor="middle" class="small">static-PDU mailbox</text>
  </g>

  <!-- PIPELINE B: tetra_mle_registration_fsm (Wrapper) -->
  <g transform="translate(490,340)">
    <rect class="wrapper" x="0" y="0" width="280" height="220" rx="6"/>
    <text x="140" y="-6" text-anchor="middle" class="lbl">tetra_mle_registration_fsm</text>
    <text x="140" y="20" text-anchor="middle" class="small">D-LOC-UPDATE workflow</text>

    <rect class="blk sys" x="20" y="50" width="240" height="40" rx="3"/>
    <text x="140" y="65" text-anchor="middle" class="lbl small">d_location_update_encoder</text>
    <text x="140" y="78" text-anchor="middle" class="small">D-LOC-UPDATE-ACCEPT build</text>

    <rect class="blk sys" x="20" y="110" width="240" height="40" rx="3"/>
    <text x="140" y="125" text-anchor="middle" class="lbl small">d_location_update_reject_encoder</text>
    <text x="140" y="138" text-anchor="middle" class="small">D-LOC-UPDATE-REJECT build</text>

    <rect class="blk mb" x="20" y="170" width="240" height="36" rx="3"/>
    <text x="140" y="185" text-anchor="middle" class="lbl small">REG_REPLY mailbox</text>
    <text x="140" y="197" text-anchor="middle" class="small">SW (attach_daemon) staged body</text>
  </g>

  <!-- PIPELINE C: tetra_pre_reply_slotgrant + pre_reply_blck -->
  <g transform="translate(820,340)">
    <rect class="wrapper" x="0" y="0" width="280" height="220" rx="6"/>
    <text x="140" y="-6" text-anchor="middle" class="lbl">tetra_pre_reply_* (Slotgrant Workflow)</text>
    <text x="140" y="20" text-anchor="middle" class="small">UL-Demand response staging</text>

    <rect class="blk sys" x="20" y="50" width="240" height="40" rx="3"/>
    <text x="140" y="65" text-anchor="middle" class="lbl small">tetra_pre_reply_slotgrant</text>
    <text x="140" y="78" text-anchor="middle" class="small">enthält mac_resource_dl_builder</text>

    <rect class="blk sys" x="20" y="110" width="240" height="40" rx="3"/>
    <text x="140" y="125" text-anchor="middle" class="lbl small">tetra_pre_reply_blck</text>
    <text x="140" y="138" text-anchor="middle" class="small">BL-ACK pre-staging</text>

    <rect class="blk sys" x="20" y="170" width="240" height="40" rx="3"/>
    <text x="140" y="185" text-anchor="middle" class="lbl small">tetra_dl_signal_queue + scheduler</text>
    <text x="140" y="198" text-anchor="middle" class="small">DL-PDU queue + dispatch</text>
  </g>

  <!-- Andere parallel -->
  <g transform="translate(1130,340)">
    <rect class="blk sys" x="0" y="50" width="240" height="40" rx="3"/>
    <text x="120" y="65" text-anchor="middle" class="lbl small">tetra_dl_nwrk_broadcast</text>
    <text x="120" y="78" text-anchor="middle" class="small">D-NWRK-BROADCAST builder</text>

    <rect class="blk sys" x="0" y="110" width="240" height="40" rx="3"/>
    <text x="120" y="125" text-anchor="middle" class="lbl small">tetra_sch_hd_shared</text>
    <text x="120" y="138" text-anchor="middle" class="small">Arbiter (enthält sch_hd_encoder)</text>

    <rect class="blk sys" x="0" y="170" width="240" height="40" rx="3"/>
    <text x="120" y="185" text-anchor="middle" class="lbl small">tetra_sb1_encoder</text>
    <text x="120" y="198" text-anchor="middle" class="small">DL Sync-Burst (SB1) build</text>
  </g>

  <!-- ============================================================ -->
  <!-- 3. VOICE-FILLER + AACH (eigene Spalte links unten) -->
  <!-- ============================================================ -->
  <g transform="translate(40,620)">
    <text x="0" y="-6" class="lbl" font-size="14">Per-Slot Content + AACH-Encoding</text>

    <rect class="blk mb" x="0" y="10" width="220" height="46" rx="3"/>
    <text x="110" y="28" text-anchor="middle" class="lbl">REG_VOICE_FILLER_*</text>
    <text x="110" y="42" text-anchor="middle" class="small">0x270..0x27C (16-word mailbox)</text>

    <rect class="blk sys" x="0" y="76" width="220" height="46" rx="3"/>
    <text x="110" y="94" text-anchor="middle" class="lbl">voice_filler_mailbox</text>
    <text x="110" y="108" text-anchor="middle" class="small">432-bit TCH-burst (SW geschrieben)</text>

    <line x1="110" y1="56" x2="110" y2="76" class="arr-red" marker-end="url(#ar)"/>

    <rect class="blk sys" x="260" y="10" width="220" height="46" rx="3"/>
    <text x="370" y="28" text-anchor="middle" class="lbl">tetra_aach_encoder</text>
    <text x="370" y="42" text-anchor="middle" class="small">14-bit AACH per TN/FN</text>

    <rect class="blk sys" x="260" y="76" width="220" height="46" rx="3"/>
    <text x="370" y="94" text-anchor="middle" class="lbl">tetra_aach_rm_encoder</text>
    <text x="370" y="108" text-anchor="middle" class="small">RM(30,14) → 30-bit on-air</text>

    <line x1="370" y1="56" x2="370" y2="76" class="arr" marker-end="url(#a)"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. BURST DISPATCH + TX-Chain (= alles in tetra_tx_chain Wrapper) -->
  <!-- ============================================================ -->
  <g transform="translate(550,620)">
    <text x="0" y="-6" class="lbl" font-size="14">Burst Assembly + RF-Output</text>

    <rect class="blk sys" x="0" y="10" width="240" height="50" rx="3"/>
    <text x="120" y="28" text-anchor="middle" class="lbl">tetra_burst_dispatcher</text>
    <text x="120" y="42" text-anchor="middle" class="small">selects per TN: voice / scheduler /</text>
    <text x="120" y="54" text-anchor="middle" class="small">queue. ← REG_VOICE_ACTIVE_MASK</text>

    <!-- tx_chain wrapper -->
    <rect class="wrapper" x="0" y="80" width="700" height="200" rx="6"/>
    <text x="350" y="74" text-anchor="middle" class="lbl">tetra_tx_chain (Wrapper)</text>

    <rect class="blk sys" x="20" y="100" width="200" height="40" rx="3"/>
    <text x="120" y="115" text-anchor="middle" class="lbl small">tetra_burst_builder</text>
    <text x="120" y="128" text-anchor="middle" class="small">NDB/SDB/SB-Layout assembly</text>

    <rect class="blk sys" x="240" y="100" width="200" height="40" rx="3"/>
    <text x="340" y="115" text-anchor="middle" class="lbl small">tetra_pi4dqpsk_mod</text>
    <text x="340" y="128" text-anchor="middle" class="small">bits → I/Q symbols</text>

    <rect class="blk sys" x="460" y="100" width="200" height="40" rx="3"/>
    <text x="560" y="115" text-anchor="middle" class="lbl small">tetra_rrc_filter</text>
    <text x="560" y="128" text-anchor="middle" class="small">RRC interp 72k→480 kSps</text>

    <rect class="blk sys" x="20" y="160" width="640" height="40" rx="3"/>
    <text x="340" y="178" text-anchor="middle" class="lbl">tetra_tx_frontend</text>
    <text x="340" y="192" text-anchor="middle" class="small">CDC sys→lvds, 480k → ~30.72 MSps, output to axi_ad9361 DDS</text>

    <line x1="120" y1="60" x2="120" y2="100" class="arr" marker-end="url(#a)"/>
    <line x1="220" y1="120" x2="240" y2="120" class="arr" marker-end="url(#a)"/>
    <line x1="440" y1="120" x2="460" y2="120" class="arr" marker-end="url(#a)"/>
    <line x1="340" y1="140" x2="340" y2="160" class="arr" marker-end="url(#a)"/>

    <text x="350" y="225" text-anchor="middle" class="small">↓ via clk_lvds nach axi_ad9361 → Antenne</text>
    <line x1="340" y1="200" x2="340" y2="245" class="arr" marker-end="url(#a)"/>
  </g>

  <!-- ============================================================ -->
  <!-- Pfeile von PDU-Build-Pipelines zum burst_dispatcher -->
  <!-- ============================================================ -->
  <g>
    <line x1="240" y1="560" x2="670" y2="620" class="arr" marker-end="url(#a)"/>
    <line x1="630" y1="560" x2="670" y2="620" class="arr" marker-end="url(#a)"/>
    <line x1="960" y1="560" x2="670" y2="620" class="arr" marker-end="url(#a)"/>
    <line x1="1250" y1="540" x2="670" y2="620" class="arr" marker-end="url(#a)"/>
    <line x1="260" y1="700" x2="550" y2="650" class="arr" marker-end="url(#a)"/>
    <line x1="370" y1="730" x2="700" y2="700" class="arr" marker-end="url(#a)"/>

    <line x1="600" y1="296" x2="670" y2="620" class="arr" marker-end="url(#a)" stroke-dasharray="2,3"/>
    <text x="670" y="540" class="small" fill="#666">(Schedule decides which Pipeline this Slot)</text>
  </g>

  <!-- DEAD CODE NOTE -->
  <g transform="translate(40,920)">
    <rect x="0" y="0" width="700" height="60" fill="#fee" stroke="#c00" stroke-width="1.5" rx="4"/>
    <text x="10" y="20" class="lbl" fill="#c00">⚠ Dead Code im RTL-Tree:</text>
    <text x="10" y="38" class="small">tetra_chan_alloc_encoder.v existiert in rtl/lmac/ aber wird NIRGENDS instantiiert.</text>
    <text x="10" y="52" class="small">Kandidat zum Löschen — keine Auswirkung auf den Build.</text>
  </g>
</svg>
